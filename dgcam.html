<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McClellanville Dollar General Cam — DGCam.live</title>
<style>
  :root{
    --live-red:#e0342a;
    --amber:#f2b705;
    --ink:#e9e6de;
    --dim:rgba(233,230,222,0.62);
    --glass:rgba(10,12,10,0.55);
    --mono: 'Courier New', ui-monospace, monospace;
    --sans: Arial, Helvetica, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:#000;
    height:100%;
    font-family:var(--sans);
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#111;
  }
  .frame-inner{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
  }
  .cam-image{
    width:100%;
    height:100%;
    object-fit:cover;
    filter: saturate(0.92) contrast(1.05) brightness(0.97);
  }

  /* ---------- flicker / scanline / noise layers ---------- */
  .scanlines{
    position:absolute; inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.10) 0px,
      rgba(0,0,0,0.10) 1px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0) 3px
    );
    mix-blend-mode:multiply;
    opacity:0.35;
  }
  .vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
  }
  .grain{
    position:absolute; inset:-50%;
    width:200%; height:200%;
    pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
    opacity:0.10;
    animation: grainShift 0.4s steps(2) infinite;
    mix-blend-mode:overlay;
  }
  @keyframes grainShift{
    0%{ transform:translate(0,0); }
    50%{ transform:translate(-2%,1%); }
    100%{ transform:translate(1%,-2%); }
  }
  .flicker{
    position:absolute; inset:0;
    pointer-events:none;
    background:#fff;
    opacity:0;
    animation: flickerPulse 6.5s infinite;
  }
  @keyframes flickerPulse{
    0%,96%,100%{ opacity:0; }
    96.3%{ opacity:0.06; }
    96.6%{ opacity:0; }
    97.1%{ opacity:0.03; }
    97.4%{ opacity:0; }
    98.8%{ opacity:0.045; }
    99%{ opacity:0; }
  }
  .dropout{
    position:absolute; inset:0;
    pointer-events:none;
    background:#000;
    opacity:0;
    animation: dropoutBlip 14s infinite;
  }
  @keyframes dropoutBlip{
    0%,99.3%,100%{ opacity:0; }
    99.4%{ opacity:0.85; }
    99.55%{ opacity:0; }
    99.65%{ opacity:0.6; }
    99.75%{ opacity:0; }
  }
  .chromabreak{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0;
    box-shadow: inset 3px 0 0 rgba(255,0,60,0.25), inset -3px 0 0 rgba(0,255,255,0.2);
    animation: chromaPulse 9s infinite;
  }
  @keyframes chromaPulse{
    0%,97%,100%{ opacity:0; }
    97.2%{ opacity:0.8; }
    97.6%{ opacity:0; }
  }

  /* ---------- HUD overlay ---------- */
  .hud{
    position:absolute; inset:0;
    pointer-events:none;
    font-family:var(--mono);
    color:var(--ink);
  }

  .top-left{
    position:absolute; top:14px; left:14px;
    display:flex; align-items:center; gap:8px;
    background:var(--glass);
    padding:6px 10px 6px 8px;
    border-radius:3px;
    backdrop-filter: blur(1px);
  }
  .live-dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--live-red);
    animation: dotPulse 1.4s ease-in-out infinite;
    box-shadow:0 0 6px rgba(224,52,42,0.9);
  }
  @keyframes dotPulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.35; transform:scale(0.82); }
  }
  .live-label{
    font-weight:bold; font-size:13px; letter-spacing:1px;
    color:var(--live-red);
  }
  .cam-title{
    font-size:11px; letter-spacing:0.5px; color:var(--ink);
    border-left:1px solid rgba(233,230,222,0.35);
    padding-left:8px;
  }

  .top-right{
    position:absolute; top:14px; right:14px;
    display:flex; flex-direction:column; align-items:flex-end; gap:5px;
  }
  .clock-box{
    background:var(--glass);
    padding:5px 9px;
    border-radius:3px;
    font-size:12px;
    letter-spacing:0.5px;
  }
  .viewers-box{
    background:var(--glass);
    padding:4px 9px;
    border-radius:3px;
    font-size:11px;
    color:var(--dim);
  }
  .viewers-box .n{ color:var(--ink); font-weight:bold; }

  .rec-box{
    position:absolute; bottom:64px; right:14px;
    background:var(--glass);
    padding:5px 10px;
    border-radius:3px;
    font-size:11px;
    display:flex; align-items:center; gap:6px;
  }
  .rec-dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--live-red);
    animation: dotPulse 1s ease-in-out infinite;
  }

  .status-chip{
    position:absolute; bottom:64px; left:14px;
    background:rgba(10,12,10,0.65);
    padding:8px 12px;
    border-radius:4px;
    font-size:13px;
    font-weight:bold;
    letter-spacing:0.5px;
    display:flex;
    align-items:center;
    gap:8px;
    border-left:3px solid var(--amber);
  }
  .status-chip .icon{ font-size:14px; }
  .status-unknown{ color:var(--amber); }

  .watermark{
    position:absolute; bottom:14px; right:14px;
    font-size:11px; color:rgba(233,230,222,0.55);
    letter-spacing:0.5px;
    font-family:var(--sans);
  }
  .watermark b{ color:rgba(233,230,222,0.8); }

  .ticker-wrap{
    position:absolute; bottom:0; left:0; right:0;
    height:34px;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.75) 30%, rgba(0,0,0,0.85) 100%);
    display:flex;
    align-items:center;
    overflow:hidden;
  }
  .ticker-badge{
    position:relative;
    z-index:2;
    background:var(--live-red);
    color:#fff;
    font-family:var(--sans);
    font-weight:bold;
    font-size:11px;
    letter-spacing:0.5px;
    padding:4px 10px;
    height:100%;
    display:flex;
    align-items:center;
  }
  .ticker-track{
    display:flex;
    white-space:nowrap;
    animation: tickerScroll 32s linear infinite;
  }
  .ticker-track span{
    padding:0 2.5em;
    font-size:13px;
    color:var(--ink);
    font-family:var(--sans);
  }
  @keyframes tickerScroll{
    0%{ transform:translateX(0%); }
    100%{ transform:translateX(-50%); }
  }

  .corner-tag{
    position:absolute; top:14px; left:50%;
    transform:translateX(-50%);
    font-family:var(--mono);
    font-size:10px;
    color:rgba(233,230,222,0.5);
    background:rgba(10,12,10,0.4);
    padding:3px 8px;
    border-radius:2px;
    letter-spacing:1px;
  }
</style>
</head>

<script>
  // ---- live clock ----
  function pad(n){ return n.toString().padStart(2,'0'); }
  function updateClock(){
    const now = new Date();
    let h = now.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if(h === 0) h = 12;
    const str = `${pad(h)}:${pad(now.getMinutes())}:${pad(now.getSeconds())} ${ampm}`;
    document.getElementById('clockBox').textContent = str;
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ---- REC timer (counts from page load) ----
  const startTime = Date.now();
  function updateRec(){
    const diff = Math.floor((Date.now() - startTime)/1000);
    const h = Math.floor(diff/3600);
    const m = Math.floor((diff%3600)/60);
    const s = diff%60;
    document.getElementById('recTimer').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
  }
  setInterval(updateRec, 1000);

  // ---- viewer count drift ----
  let viewers = 214;
  setInterval(()=>{
    viewers += Math.floor(Math.random()*7) - 3;
    if(viewers < 40) viewers = 40;
    document.getElementById('viewerCount').textContent = viewers;
  }, 2500);

  // ---- open/closed status (randomized to sell the "who knows" joke,
  //      swap this for a real check if you ever wire up a sensor) ----
  const statuses = [
    { text: "STATUS: UNCONFIRMED — PROCEED AT OWN RISK", cls: "status-unknown", color:"#f2b705" },
    { text: "STATUS: LIGHTS ON, DOOR UNCLEAR", cls: "status-unknown", color:"#f2b705" },
    { text: "STATUS: LAST CONFIRMED OPEN 3 DAYS AGO", cls: "status-unknown", color:"#f2b705" },
  ];
  const statusEl = document.getElementById('statusText');
  let sIdx = 0;
  function rotateStatus(){
    sIdx = (sIdx+1) % statuses.length;
    statusEl.textContent = statuses[sIdx].text;
  }
  setInterval(rotateStatus, 8000);

  // ---- ticker content, doubled for seamless loop ----
  const tickerItems = [
    "Is it open? Nobody knows. Stay tuned.",
    "🦥 Rare sighting: an open Dollar General, last confirmed 3 days ago.",
    "No park rangers on site. No confirmed hours. No promises.",
    "This feed exists so you don't have to drive out and find out the hard way.",
    "Cars in lot ≠ store open. Please manage expectations.",
    "Sponsored by nobody. Maintained by hope."
  ];
  const track = document.getElementById('tickerTrack');
  const full = tickerItems.concat(tickerItems).map(t => `<span>${t}</span>`).join('');
  track.innerHTML = full;
</script>
